name: Fuel Verification
on:
  pull_request:
    paths: ['trajectories/**']
  push:
    paths: ['trajectories/**']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'gate = fail-closed | report = 只报覆盖率'
        required: false
        default: report
        type: choice
        options: [gate, report]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fuel trajectory gate (fail-closed)
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'gate' }}
          TRAJ_DIR: trajectories
        run: python .github/scripts/fuel_verify.py
